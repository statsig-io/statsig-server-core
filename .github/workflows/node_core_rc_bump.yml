name: Update RC Versions within Statsig Repo

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Enter RC tag manually (e.g. 0.9.2-rc.2509181925)"
        required: false
  release:
    types: [published]

jobs:
  update-node-core-rc-version:
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && contains(github.event.release.tag_name, '-rc.'))
    runs-on: ubuntu-latest
    # pnpm 10.33.2 runs on Node, and resolving this 34-project workspace
    # exhausted V8's default ~1.9 GB heap in run 35287609253. The runner has
    # 16 GB, so the default cap was the binding limit, not the machine. Set at
    # job level so it covers every pnpm resolve and install in this job,
    # including the lockfile-only resolve in "Bump RC Version".
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Resolve RC version from release event
        id: rc_ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
            if [ -z "$TAG" ]; then
              echo "❌ No tag provided via workflow_dispatch input."
              exit 1
            fi
          else
            TAG="${{ github.event.release.tag_name }}"
          fi
          VER="${TAG#v}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Resolved RC version: $VER"

      - name: Verify / Wait for RC version exists on npm
        env:
          PKG: "@statsig/statsig-node-core"
          VER: ${{ steps.rc_ver.outputs.version }}
          INTERVAL_SEC: "30" # polling interval (seconds)
          TIMEOUT_MIN: "30"
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$VER" != *"-rc."* ]]; then
            echo "::error::Version $VER is not an RC (missing '-rc.'). Aborting."
            exit 1
          fi

          echo "Waiting for ${PKG}@${VER} to appear on npm..."
          deadline=$(( $(date +%s) + TIMEOUT_MIN*60 ))
          while true; do
            if npm view "${PKG}@${VER}" version --json >/dev/null 2>&1; then
              echo "[SUCCESS] Found ${PKG}@${VER} on npm"
              break
            fi
            now=$(date +%s)
            if [ "$now" -ge "$deadline" ]; then
              echo "::error::Timed out after ${TIMEOUT_MIN} minutes waiting for ${PKG}@${VER} on npm."
              exit 1
            fi
            echo "…not yet, sleeping ${INTERVAL_SEC}s"
            sleep "${INTERVAL_SEC}"
          done

      # "Install dependencies" and the final frozen install in "Bump RC Version"
      # each materialise the whole workspace. Reclaim the prebuilt toolchains
      # this job never touches so that tree fits.
      #
      # Must run before "Set up Node.js": it clears the hosted tool cache, and
      # setup-node reinstalls Node there afterwards. Run it later and it deletes
      # the Node that Corepack just put the pnpm shim into.
      - name: Free disk space on runner
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost /usr/local/share/powershell || true
          if [ -n "${AGENT_TOOLSDIRECTORY:-}" ]; then
            sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true
          fi
          df -h /

      - name: Checkout Statsig Repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: statsig-io/statsig
          ref: main
          token: ${{ secrets.ROIM }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      # Runs after "Checkout Statsig Repo": corepack install reads the
      # packageManager pin from the checked-out monorepo's package.json.
      - name: Install pnpm
        run: corepack enable pnpm && corepack install

      # "Bump RC Version" no longer needs this install: it resolves with
      # --lockfile-only --ignore-scripts and runs its own frozen install. The
      # step is kept for now.
      - name: Install dependencies
        run: pnpm install

      - name: Bump RC Version
        id: bump_rc
        shell: bash
        env:
          RC_VER: ${{ steps.rc_ver.outputs.version }}
        run: |
          set -euo pipefail
          : "${RC_VER:?Set RC_VER to the triggering release version}"
          export RC_VER
          before_dir=$(mktemp -d)
          dirs=(lib lib/node/entity lib/node/service-core)
          restore_manifests() {
            for dir in "${dirs[@]}"; do
              cp "$before_dir/$dir/package.json" "$dir/package.json"
            done
          }
          trap 'restore_manifests; rm -rf "$before_dir"' EXIT
          cp pnpm-lock.yaml "$before_dir/pnpm-lock.yaml"
          for dir in "${dirs[@]}"; do
            mkdir -p "$before_dir/$dir"
            cp "$dir/package.json" "$before_dir/$dir/package.json"
          done
          node <<'NODE'
          const fs = require('fs');
          const version = process.env.RC_VER;
          if (!/^\d+\.\d+\.\d+-rc\.\d+$/.test(version)) throw new Error('Invalid RC version');
          for (const dir of ['lib', 'lib/node/entity', 'lib/node/service-core']) {
            const path = `${dir}/package.json`;
            const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
            for (const suffix of ['', '-linux-x64-gnu', '-linux-x64-musl']) {
              const pkg = `@statsig/statsig-node-core${suffix}`;
              if (manifest.dependencies?.[`${pkg}-rc`] !== `npm:${pkg}@rc`) {
                throw new Error(`Unexpected RC alias: ${path} ${pkg}-rc`);
              }
              manifest.dependencies[`${pkg}-rc`] = `npm:${pkg}@${version}`;
            }
            fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n');
          }
          NODE
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile \
            --config.minimum-release-age=4320 \
            '--config.minimum-release-age-exclude=@statsig/statsig-node-core*'
          node - "$before_dir/pnpm-lock.yaml" pnpm-lock.yaml "$RC_VER" <<'NODE'
          const fs = require('fs');
          const [beforePath, candidatePath, version] = process.argv.slice(2);
          const before = fs.readFileSync(beforePath, 'utf8');
          const candidate = fs.readFileSync(candidatePath, 'utf8');
          if (!/^\d+\.\d+\.\d+-rc\.\d+$/.test(version)) throw new Error('Invalid RC version');
          const esc = s => s.replaceAll('.', '\\.');
          const oldVersions = new Set([...before.matchAll(/version: '@statsig\/statsig-node-core@(\d+\.\d+\.\d+-rc\.\d+)'/g)].map(m => m[1]));
          if (oldVersions.size !== 1) throw new Error('Expected one existing SDK RC version');
          const [oldVersion] = oldVersions;
          const oldVersionRe = new RegExp(esc(oldVersion) + '(?![0-9])', 'g');
          for (const line of before.split('\n')) {
            if (line.search(oldVersionRe) >= 0 && !line.includes('@statsig/statsig-node-core')) {
              throw new Error('RC version occurs outside SDK references: ' + line);
            }
          }
          let output = before.replace(oldVersionRe, version);
          const sdkKey = new RegExp("^'@statsig/statsig-node-core(?:-[^@]+)?@" + esc(version) + "'$" );
          for (const section of ['packages', 'snapshots']) {
            const marker = '\n' + section + ':\n';
            const start = output.indexOf(marker) + marker.length;
            if (start < marker.length) throw new Error('Missing section: ' + section);
            const rest = output.slice(start);
            const endOffset = rest.search(/^\S/m);
            const end = endOffset < 0 ? output.length : start + endOffset;
            const candidateStart = candidate.indexOf(marker) + marker.length;
            const candidateRest = candidate.slice(candidateStart);
            const candidateEnd = candidateRest.search(/^\S/m);
            const source = candidateEnd < 0 ? candidateRest : candidateRest.slice(0, candidateEnd);
            const blockRe = /^  ([^\n]+?):[^\n]*\n(?:(?:^    [^\n]*|^)\n)*/gm;
            const blocks = new Map([...source.matchAll(blockRe)].filter(m => sdkKey.test(m[1])).map(m => [m[1], m[0]]));
            if (!blocks.size) throw new Error('No resolved SDK blocks in ' + section);
            const body = output.slice(start, end).replace(blockRe, (block, key) => {
              if (!sdkKey.test(key)) return block;
              const resolved = blocks.get(key);
              if (!resolved) throw new Error('SDK package set changed; inspect dependency closure: ' + key);
              if (section === 'snapshots' && resolved !== block) {
                throw new Error('SDK dependency graph changed; inspect dependency closure: ' + key);
              }
              blocks.delete(key);
              return resolved;
            });
            if (blocks.size) throw new Error('SDK package set expanded; inspect dependency closure');
            output = output.slice(0, start) + body + output.slice(end);
          }
          fs.writeFileSync(candidatePath, output);
          NODE
          restore_manifests
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Create Pull Request
        id: create_rc_pr
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.ROIM }}
          commit-message: "Automator: [automated][sdk] Bump Statsig Node Core RC deps"
          title: "[automated][sdk] bump statsig node core rc deps"
          body: |
            This PR was auto-generated on RC release.
            - Updated in `lib`, `lib/node/entity`, `lib/node/service-core`
            - Packages:
              - @statsig/statsig-node-core-rc
              - @statsig/statsig-node-core-linux-x64-gnu-rc
              - @statsig/statsig-node-core-linux-x64-musl-rc
          branch: bump_statsig_rc_sdk_version-${{ github.run_id }}
          labels: automation, rc-bump
          team-reviewers: sdk

      - name: Enable auto-merge for PR
        if: steps.create_rc_pr.outputs.pull-request-number != ''
        uses: peter-evans/enable-pull-request-automerge@a660677d5469627102a1c1e11409dd063606628d # v3
        with:
          token: ${{ secrets.ROIM }}
          pull-request-number: ${{ steps.create_rc_pr.outputs.pull-request-number }}
          merge-method: MERGE
          repository: statsig-io/statsig

      - name: Wait until PR is auto-merged
        id: check_pr
        if: steps.create_rc_pr.outputs.pull-request-number != ''
        run: |
          pr_number=${{ steps.create_rc_pr.outputs.pull-request-number }}
          repo="statsig-io/statsig"
          echo "⏳ Waiting for PR #$pr_number to be auto-merged..."
          for i in {1..60}; do
            merged=$(gh pr view $pr_number --repo $repo --json mergedAt,state -q 'if .mergedAt != null or .state=="MERGED" then "true" else "false" end' || echo "false")
            if [ "$merged" = "true" ]; then
              echo "✅ PR #$pr_number has been merged!"
              echo "merge_result=success" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "Still waiting... (attempt $i)"
            sleep 30
          done
          echo "⏰ Timeout waiting for auto-merge."
          echo "merge_result=timeout" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.ROIM }}

      - name: Notify Slack about new RC bump PR
        if: steps.create_rc_pr.outputs.pull-request-url != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SDK_SLACK_WEBHOOK_URL }}
        run: |
          pr_url="${{ steps.create_rc_pr.outputs.pull-request-url }}"
          pr_title="[automated][sdk] bump statsig node core rc deps"
          rc_version="${{ steps.rc_ver.outputs.version }}"
          actor="${{ github.actor }}"
          repo="statsig-io/statsig"
          branch="bump_statsig_rc_sdk_version-${{ github.run_id }}"
          merge_result="${{ steps.check_pr.outputs.merge_result }}"

          if [ "$merge_result" = "success" ]; then
            color="#36a64f"
            text="✅ *${actor}*'s RC bump PR for *${rc_version}* passed all checks and was *auto-merged* into *${repo}*."
          else
            color="#ff9f00"
            text="⚠️ *${actor}*'s RC bump PR for *${rc_version}* failed some checks or auto-merge did not occur.\nPlease review manually."
          fi

          payload=$(cat <<EOF
          {
            "attachments": [
              {
                "color": "${color}",
                "title": ":rocket: Node Core RC Bump Status Update",
                "text": "${text}\n<${pr_url}|View PR>",
                "fields": [
                  { "title": "RC Version", "value": "${rc_version}", "short": true },
                  { "title": "Branch", "value": "${branch}", "short": true },
                  { "title": "Repository", "value": "${repo}", "short": true }
                ],
                "footer": "Posted by 🚀 SDKbot",
                "ts": $(date +%s)
              }
            ]
          }
          EOF
          )

          curl -X POST -H 'Content-type: application/json' \
            --data "$payload" \
            "$SLACK_WEBHOOK_URL"

      - name: Notify Slack about failed RC bump
        if: failure() && steps.bump_rc.outcome == 'failure'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SDK_SLACK_WEBHOOK_URL }}
          RC_VERSION: ${{ steps.rc_ver.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          text="❌ The RC bump for *${RC_VERSION}* failed in the Bump RC Version step. No PR was opened. If the SDK's own dependencies changed, update the lockfile by hand."

          payload=$(cat <<EOF
          {
            "attachments": [
              {
                "color": "#d00000",
                "title": ":rotating_light: Node Core RC Bump Failed",
                "text": "${text}\n<${RUN_URL}|View run>",
                "fields": [
                  { "title": "RC Version", "value": "${RC_VERSION}", "short": true },
                  { "title": "Repository", "value": "statsig-io/statsig", "short": true }
                ],
                "footer": "Posted by 🚀 SDKbot",
                "ts": $(date +%s)
              }
            ]
          }
          EOF
          )

          curl -X POST -H 'Content-type: application/json' \
            --data "$payload" \
            "$SLACK_WEBHOOK_URL"
