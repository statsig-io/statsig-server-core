[package]
name = "amplitude-rust"
description = "Amplitude event tracking SDK for Rust servers"
edition.workspace = true
license.workspace = true
version.workspace = true
readme = "README.md"
publish = false

[dependencies]
chrono = "0.4.40"
reqwest = { version = "0.12.14", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.143"
serde_with = { version = "3.4.0", default-features = false, features = ["macros"] }
uuid = { version = "1.10.0", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.39.1", features = ["macros", "rt"] }
wiremock = "0.6.2"
