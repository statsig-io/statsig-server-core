[package]
name = "amplitude-rust"
description = "Independent Amplitude event client for the Statsig workspace"
version = "0.1.0"
edition = "2021"
license = "ISC"
publish = false

[dependencies]
log = "0.4.22"
reqwest = { version = "0.12.14", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.143"
tokio = { version = "1.39.1", features = ["rt", "sync", "time", "macros"] }
uuid = { version = "1.10.0", features = ["v4"] }

[dev-dependencies]
wiremock = "0.6.2"
