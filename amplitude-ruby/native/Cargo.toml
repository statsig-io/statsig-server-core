[package]
name = "amplitude_ruby_ffi"
description = "Native bindings for the Amplitude Ruby SDK"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
amplitude-rust = { path = "../../amplitude-rust" }
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.143"
tokio = { version = "1.39.1", features = ["net", "rt", "time"] }
